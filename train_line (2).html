<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build the Train Line</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#18213d; --muted:#5b6785; --line:#d9deea;
  --accent:#2f5bea; --accent-soft:#e3eaff; --good:#15803d; --good-soft:#dcf5e5;
  --warn:#c2410c; --warn-soft:#ffe9dc; --bad:#b91c1c; --bad-soft:#fde2e2;
  --grid:#e6eaf3; --axis:#aab3c8; --board:#ffffff; --purple:#7c3aed; --teal:#0f766e;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1424; --card:#171d33; --ink:#e8ecf8; --muted:#9aa6c4; --line:#2a3354;
    --accent:#7b9bff; --accent-soft:#222c54; --good:#5fd18a; --good-soft:#143524;
    --warn:#ffa56b; --warn-soft:#3a2416; --bad:#ff8b8b; --bad-soft:#3d1a1a;
    --grid:#222a47; --axis:#4a557c; --board:#121830; --purple:#b69cff; --teal:#4fd1c5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:18px 20px 6px;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{margin:2px 0 12px;color:var(--muted)}
#steps{display:flex;flex-wrap:wrap;gap:8px}
#steps button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
#steps button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
#steps button.done::after{content:" ✓";color:var(--good);font-weight:700}
#steps button.cur.done::after{color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;max-width:1280px;margin:0 auto;padding:10px 20px 30px}
@media (max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
#boardwrap{padding:8px}
svg{display:block;width:100%;height:auto}
#board{background:var(--board);border-radius:10px;touch-action:none;user-select:none}
#graph{margin-top:8px;background:var(--board);border-radius:10px}
#panel h2{margin:0 0 4px;font-size:21px}
#panel .goal{margin:0 0 8px;font-size:16px}
.formula{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
.facts{margin:8px 0;padding-left:20px}
.facts li{margin:3px 0}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0}
.row label{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:15px;max-width:100%}
.row select{max-width:100%}
input[type=number]{width:84px;font:inherit;font-size:16px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=range]{width:200px}
select{font:inherit;font-size:15px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.readout{font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.readout div{margin:2px 0}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.mid{color:var(--warn);font-weight:600}
#fb{margin:8px 0;padding:0}
#fb .msg{border-radius:10px;padding:9px 12px;font-size:15.5px}
#fb .good{background:var(--good-soft);color:var(--good)}
#fb .bad{background:var(--bad-soft);color:var(--bad)}
#fb .info{background:var(--warn-soft);color:var(--warn)}
#hints,#working,#note{margin:8px 0}
#hints .hh{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.btn.small{padding:2px 10px;font-size:13px}
.mine{stroke:var(--purple);stroke-width:3.5;stroke-dasharray:9 6;fill:none}
#hints .h{background:var(--warn-soft);border-radius:10px;padding:7px 12px;margin:6px 0;font-size:15px}
#working .w{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:15px}
#note .n{border-left:4px solid var(--good);padding:4px 12px;font-size:15.5px;background:var(--good-soft);border-radius:0 10px 10px 0}
#working ol{margin:4px 0;padding-left:20px}
sub{font-size:.75em}
/* svg */
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1.6}
.tick{fill:var(--muted);font-size:13px}
.poly{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 5;fill:none}
.curve{stroke:var(--accent);stroke-width:4.5;fill:none;stroke-linecap:round}
.curve2{stroke:var(--purple);stroke-width:4.5;fill:none;stroke-linecap:round}
.curve3{stroke:var(--teal);stroke-width:4.5;fill:none;stroke-linecap:round}
.ghost{stroke:var(--muted);stroke-width:2;fill:none;opacity:.55}
.cp{fill:var(--ink)}
.hd{fill:var(--warn);stroke:var(--card);stroke-width:2.5;cursor:grab}
.hit{fill:transparent;cursor:grab}
.lbl{fill:var(--ink);font-size:17px;font-weight:600;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblm{fill:var(--muted);font-size:15px;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblg{fill:var(--good);font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblw{fill:var(--warn);font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblb{fill:var(--bad);font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.gate{fill:none;stroke:var(--warn);stroke-width:3.5}
.guess{fill:none;stroke:var(--bad);stroke-width:3.5}
.train{fill:var(--accent);stroke:var(--card);stroke-width:2.5}
.xr1{stroke:#ea580c;stroke-width:2.5;fill:none}
.xr2{stroke:#16a34a;stroke-width:2.5;fill:none}
.xr3{stroke:#9333ea;stroke-width:3;fill:none}
.chord{stroke:var(--bad);stroke-width:3.5;fill:none}
.spd{stroke:var(--accent);stroke-width:3;fill:none}
.sel{stroke-width:6}
.tiny{font-size:13px;color:var(--muted)}
details>summary{cursor:pointer;margin:4px 0}
@media (max-width:700px){
  header{padding:14px 14px 4px} h1{font-size:22px} main{padding:8px 12px 24px;gap:12px}
  .card{padding:12px}
  .tick{font-size:21px}.lbl,.lblg,.lblw,.lblb{font-size:25px;stroke-width:6px}.lblm{font-size:21px;stroke-width:6px}
  .btn{padding:10px 16px}
  input[type=range]{width:min(200px,60vw)}
}
</style>
</head>
<body>
<header>
  <h1>Build the Train Line</h1>
  <p class="sub">A hands-on companion to the curves lectures. Five short levels, no timer, no marks: compute, drag, and watch what happens.</p>
  <nav id="steps"></nav>
  <p class="tiny" style="margin:8px 0 0"><button class="btn" id="bReset" style="padding:2px 8px;font-size:12px">Clear ✓ marks</button></p>
</header>
<main>
  <section class="card" id="boardwrap">
    <svg id="board" viewBox="0 0 760 560" role="img" aria-label="Track drawing board"></svg>
    <svg id="graph" viewBox="0 0 760 170" style="display:none" role="img" aria-label="Speed of the train over time"></svg>
    
  </section>
  <aside class="card" id="panel">
    <h2 id="title"></h2>
    <div id="story"></div>
    <div id="inputs"></div>
    <div id="readout"></div>
    <div id="fb"></div>
    <div class="btns" id="btns">
      <button class="btn primary" id="bCheck">Check</button>
      <button class="btn" id="bHint">Hint</button>
      <button class="btn" id="bWork">Formulas</button>
      <button class="btn" id="bNext" style="display:none">Next level →</button>
    </div>
    <div id="hints"></div>
    <div id="working"></div>
    <div id="note"></div>
  </aside>
</main>

<script>
'use strict';
/* ------------------------------------------------------------------ helpers */
const NS='http://www.w3.org/2000/svg', W=760, H=560;
const board=document.getElementById('board'), graph=document.getElementById('graph');
const $=id=>document.getElementById(id);
const fmt=n=>{const r=Math.round(n*1000)/1000;return (Object.is(r,-0)?0:r).toString()};
const a1=n=>(Math.round(n*10)/10).toString();
const pf=p=>'('+fmt(p[0])+', '+fmt(p[1])+')';
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]), lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
const snap=v=>Math.round(v*10)/10;
const deg=r=>r*180/Math.PI;
const angleBetween=(a,b)=>Math.abs(deg(Math.atan2(cross(a,b),dot(a,b))));
function bez(P,t){const u=1-t;return [0,1].map(i=>u*u*u*P[0][i]+3*t*u*u*P[1][i]+3*t*t*u*P[2][i]+t*t*t*P[3][i]);}
function dbez(P,t){const u=1-t;return [0,1].map(i=>3*u*u*(P[1][i]-P[0][i])+6*u*t*(P[2][i]-P[1][i])+3*t*t*(P[3][i]-P[2][i]));}
function casteljau(P,t){const r1=[0,1,2].map(i=>lerp(P[i],P[i+1],t));const r2=[0,1].map(i=>lerp(r1[i],r1[i+1],t));const r3=[lerp(r2[0],r2[1],t)];return [P,r1,r2,r3];}
function split(P,t=.5){const c=casteljau(P,t);return [[c[0][0],c[1][0],c[2][0],c[3][0]],[c[3][0],c[2][1],c[1][2],c[0][3]]];}
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;(parent||board).appendChild(e);return e;}
function parseNum(s){const v=parseFloat(String(s).replace(',','.'));return Number.isFinite(v)?v:null;}
function clone(P){return P.map(p=>p.slice());}

/* view (world -> screen) */
let view={cx:5,cy:4,w:12};
const vh=()=>view.w*H/W;
const X=x=>(x-(view.cx-view.w/2))/view.w*W;
const Y=y=>H-(y-(view.cy-vh()/2))/vh()*H;
const WX=px=>px/W*view.w+(view.cx-view.w/2);
const WY=py=>(H-py)/H*vh()+(view.cy-vh()/2);

function clearBoard(){while(board.firstChild)board.removeChild(board.firstChild);}
function drawGrid(){
  const x0=view.cx-view.w/2,x1=view.cx+view.w/2,h=vh(),y0=view.cy-h/2,y1=view.cy+h/2;
  const step=view.w>16?2:1;
  for(let x=Math.ceil(x0);x<=x1;x++){ if(x%step)continue; el('line',{x1:X(x),y1:0,x2:X(x),y2:H,class:x===0?'axis':'grid'});
    el('text',{x:X(x)+3,y:H-6,class:'tick'},board,String(x)); }
  for(let y=Math.ceil(y0);y<=y1;y++){ if(y%step)continue; el('line',{x1:0,y1:Y(y),x2:W,y2:Y(y),class:y===0?'axis':'grid'});
    el('text',{x:4,y:Y(y)-4,class:'tick'},board,String(y)); }
}
function path(P,cls){return el('path',{d:`M${X(P[0][0])} ${Y(P[0][1])} C${X(P[1][0])} ${Y(P[1][1])}, ${X(P[2][0])} ${Y(P[2][1])}, ${X(P[3][0])} ${Y(P[3][1])}`,class:cls});}
function poly(pts,cls){return el('polyline',{points:pts.map(p=>X(p[0])+','+Y(p[1])).join(' '),class:cls});}
function seg(a,b,cls,extra){return el('line',Object.assign({x1:X(a[0]),y1:Y(a[1]),x2:X(b[0]),y2:Y(b[1]),class:cls},extra||{}));}
function dot_(p,r,cls){return el('circle',{cx:X(p[0]),cy:Y(p[1]),r:r,class:cls});}
function label(p,txt,dx,dy,cls,anchor){return el('text',{x:X(p[0])+(dx||0),y:Y(p[1])+(dy||0),class:cls||'lbl','text-anchor':anchor||'start'},board,txt);}
const MS=()=>(window.matchMedia&&window.matchMedia('(max-width:700px)').matches)?1.7:1;
function handle(id,p){const m=MS();el('circle',{cx:X(p[0]),cy:Y(p[1]),r:11*Math.min(m,1.35),class:'hd','data-h':id});el('circle',{cx:X(p[0]),cy:Y(p[1]),r:23*m,class:'hit','data-h':id});}
function arrow(a,b,color,width){
  const A=[X(a[0]),Y(a[1])],B=[X(b[0]),Y(b[1])],d=[B[0]-A[0],B[1]-A[1]],L=Math.hypot(d[0],d[1]); if(L<2)return;
  const u=[d[0]/L,d[1]/L],n=[-u[1],u[0]],s=11;
  el('line',{x1:A[0],y1:A[1],x2:B[0]-u[0]*s*.6,y2:B[1]-u[1]*s*.6,stroke:color,'stroke-width':width||3.5,'stroke-linecap':'round'});
  el('polygon',{points:`${B[0]},${B[1]} ${B[0]-u[0]*s*1.4+n[0]*s*.6},${B[1]-u[1]*s*1.4+n[1]*s*.6} ${B[0]-u[0]*s*1.4-n[0]*s*.6},${B[1]-u[1]*s*1.4-n[1]*s*.6}`,fill:color});
}
function trainAt(P,t,color){
  const p=bez(P,t),d=dbez(P,t);const ang=-Math.atan2(d[1],d[0])*180/Math.PI;
  const g=el('g',{transform:`translate(${X(p[0])} ${Y(p[1])}) rotate(${ang})`});
  el('rect',{x:-17,y:-10,width:34,height:20,rx:6,class:'train',style:color?`fill:${color}`:''},g);
  el('polygon',{points:'17,-8 27,0 17,8',fill:'var(--warn)'},g);
  el('circle',{cx:-6,cy:11,r:4,fill:'var(--ink)'},g);el('circle',{cx:6,cy:11,r:4,fill:'var(--ink)'},g);
}

/* ------------------------------------------------------------------ panel plumbing */
let cur=0, done=JSON.parse((()=>{try{return localStorage.getItem('trainline.done.v8')||'[]'}catch(e){return '[]'}})());
let fields=[], hintsShown=0, drag=null, anim=null;
function saveDone(){try{localStorage.setItem('trainline.done.v8',JSON.stringify(done));}catch(e){}}
function say(kind,html){ $('fb').innerHTML=html?`<div class="msg ${kind}">${html}</div>`:''; }
function numField(parent,labelHtml,get,set){
  const lab=document.createElement('label');lab.innerHTML='<span>'+labelHtml+'</span>';
  const inp=document.createElement('input');inp.type='number';inp.step='any';inp.inputMode='decimal';
  const f={inp,get};fields.push(f);
  inp.addEventListener('input',()=>{const v=parseNum(inp.value);if(v!==null){set(v);}levels[cur].render();});
  lab.appendChild(inp);parent.appendChild(lab);return f;
}
function emptyField(parent,labelHtml){ // text-only answer fields (no live model)
  const lab=document.createElement('label');lab.innerHTML='<span>'+labelHtml+'</span>';
  const inp=document.createElement('input');inp.type='number';inp.step='any';inp.inputMode='decimal';lab.appendChild(inp);parent.appendChild(lab);return inp;}
function syncInputs(){for(const f of fields){if(document.activeElement!==f.inp){const v=f.get();f.inp.value=(v===null||v===undefined)?'':fmt(v);}}}
function newRow(){const r=document.createElement('div');r.className='row';$('inputs').appendChild(r);return r;}
function stopAnim(){if(anim){cancelAnimationFrame(anim.id);anim=null;}}
function buildSteps(){
  const nav=$('steps');nav.innerHTML='';
  levels.forEach((L,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+L.short;b.className=(i===cur?'cur ':'')+(done.includes(i)?'done':'');b.onclick=()=>go(i);nav.appendChild(b);});
}
function go(i){
  stopAnim();cur=i;fields=[];hintsShown=0;
  ['story','inputs','readout','fb','hints','working','note'].forEach(k=>$(k).innerHTML='');
  $('title').textContent=(i+1)+'. '+levels[i].title;
  hintsHidden=false;$('bWork').textContent='Formulas';
  $('bNext').style.display='none';$('bCheck').style.display=levels[i].noCheck?'none':'';
  $('bHint').style.display=levels[i].hints&&levels[i].hints.length?'':'none';
  $('bWork').style.display=levels[i].formulas?'':'none';
  graph.style.display=levels[i].graph?'':'none';
  levels[i].setup();buildSteps();levels[i].render();syncInputs();
}
function pass(noteHtml){
  if(!done.includes(cur)){done.push(cur);saveDone();}
  buildSteps();
  if(noteHtml)$('note').innerHTML=`<div class="n">${noteHtml}</div>`;
  if(cur<levels.length-1){$('bNext').style.display='';}
}
$('bCheck').onclick=()=>levels[cur].check();
$('bNext').onclick=()=>go(cur+1);
$('bReset').onclick=()=>{done=[];saveDone();buildSteps();};
let hintsHidden=false;
function renderHints(){
  const H_=levels[cur].hints,box=$('hints');box.innerHTML='';if(hintsShown===0)return;
  const head=document.createElement('div');head.className='hh';
  head.innerHTML=`<span><b>Hints</b> (${hintsShown} of ${H_.length})</span>`;
  const t=document.createElement('button');t.className='btn small';t.textContent=hintsHidden?'Show':'Hide';
  t.onclick=()=>{hintsHidden=!hintsHidden;renderHints();};head.appendChild(t);box.appendChild(head);
  if(hintsHidden)return;
  for(let i=0;i<hintsShown;i++){const d=document.createElement('div');d.className='h';d.innerHTML=`<b>${i+1}.</b> `+H_[i];box.appendChild(d);}
}
$('bHint').onclick=()=>{const H_=levels[cur].hints;
  if(hintsHidden&&hintsShown>0){hintsHidden=false;renderHints();return;}
  if(hintsShown<H_.length){hintsShown++;hintsHidden=false;renderHints();}else{say('info','No more hints. Check the formulas, or ask your instructor.');}};
$('bWork').onclick=()=>{const w=$('working');if(w.innerHTML){w.innerHTML='';$('bWork').textContent='Formulas';}else{w.innerHTML=levels[cur].formulas();$('bWork').textContent='Hide formulas';}};

/* dragging */
board.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-h]');
  if(!t){const L=levels[cur];if(L.onTap){const r=board.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;L.onTap([WX(px),WY(py)],[px,py]);e.preventDefault();}return;}
  drag={id:t.getAttribute('data-h')};if(levels[cur].onDown)levels[cur].onDown(drag.id);e.preventDefault();});
window.addEventListener('pointermove',e=>{
  if(!drag)return;const r=board.getBoundingClientRect();
  const sn=levels[cur].snapTo,sf=sn?(v=>Math.round(v/sn)*sn):snap;
  const p=[sf(WX((e.clientX-r.left)/r.width*W)),sf(WY((e.clientY-r.top)/r.height*H))];
  levels[cur].onDrag(drag.id,p);syncInputs();levels[cur].render();
});
window.addEventListener('pointerup',()=>{const d=drag;drag=null;if(d&&levels[cur].onUp)levels[cur].onUp(d.id);});
window.addEventListener('pointercancel',()=>{drag=null;});
try{window.matchMedia('(max-width:700px)').addEventListener('change',()=>{if(typeof levels!=='undefined')levels[cur].render();});}catch(e){}
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.type==='number'&&!levels[cur].noCheck){levels[cur].check();}});

/* ------------------------------------------------------------------ shared pieces */
function joinInfo(hin,hout){
  const ang=(len(hin)>1e-9&&len(hout)>1e-9)?angleBetween(hin,hout):180;
  const fwd=dot(hin,hout)>0;
  const diff=len(sub(hout,hin));
  return {angle:ang,fwd,ratio:len(hin)>1e-9?len(hout)/len(hin):0,c1:diff<=0.25,g1:fwd&&ang<=3,diff};
}
function joinBadge(info){ return info.c1?['C¹','ok']:info.g1?['G¹ only','mid']:['corner','no']; }
function niceStep(v){const k=Math.pow(10,Math.floor(Math.log10(v/5)));const r=(v/5)/k;return (r<=1?1:r<=2?2:r<=5?5:10)*k;}
function speedGraph(pieces,tau,T,order){
  order=order||1;const vec=(P,t)=>order===1?dbez(P,t):d2bez(P,t),sc=order===1?1/T:1;
  while(graph.firstChild)graph.removeChild(graph.firstChild);
  const n=pieces.length,total=n*T,L=48,R=748,top=14,bot=140;
  const samples=[];let vmax=0;
  pieces.forEach((P,i)=>{for(let k=0;k<=60;k++){const t=k/60,v=len(vec(P,t))*sc;samples.push([i*T+t*T,v]);vmax=Math.max(vmax,v);}});
  vmax=Math.ceil(vmax*1.1);
  const gx=s=>L+(s/total)*(R-L),gy=v=>bot-(v/vmax)*(bot-top);
  el('line',{x1:L,y1:bot,x2:R,y2:bot,class:'axis'},graph);el('line',{x1:L,y1:top,x2:L,y2:bot,class:'axis'},graph);

function trainOnTrack(pieces,tau,T,color){

  toDesign(msg){this.ph='des';this.gi=0;this.D=[[3,1.5],[7,1.5]];this.buildDes();this.render();if(msg)say('good',msg);},

  },
  formulas(){return `<div class="formula"><b>bulge</b> of a piece = the larger of the distances of its two inner control points from the line through its end points.<br>Distance of a point X from the line through S and T: |(T−S) × (X−S)| / |T−S|, where (u × v) = u<sub>x</sub>v<sub>y</sub> − u<sub>y</sub>v<sub>x</sub> and |w| = √(w<sub>x</sub>² + w<sub>y</sub>²).<br>A piece is flat enough when its bulge ≤ the tolerance.</div>`;}

/* ------------------------------------------------------------------ LEVEL 4: fix a join for C2 */

/* ------------------------------------------------------------------ LEVEL 5: playground */
const LP={short:'Playground',title:'Playground',noCheck:true,graph:true,T:3,pieces:null,sel:0,xr:false,tx:.5,st:null,fx:null,toast:null,colour:true,fitted:false,v:null,got:null,
  setup(){

    const s=this;
    const r2=newRow();
    const add_=document.createElement('button');add_.className='btn';add_.textContent='Add a piece';
    add_.onclick=()=>{const P=s.pieces[s.pieces.length-1],E=P[3],h=sub(P[3],P[2]);
      const rot=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a)];
      const p1=add(E,mul(rot(h,1.1),0.6)),p2=add(p1,rot(h,-0.2)),p3=add(p2,rot(h,0.9));

    del_.onclick=()=>{if(s.pieces.length>1)s.pieces.pop();s.fitted=false;s.fx=null;s.render();};
    const rst=document.createElement('button');rst.className='btn';rst.textContent='Reset';rst.onclick=()=>{s.fx=null;s.pieces=[clone(A3),clone(B4)];s.fitted=false;if(s.st){s.st.tau=0;s.st.prev=0;}s.render();};
    r2.append(add_,del_,rst);
    const r3=newRow();r3.innerHTML=`<label><input type="checkbox" id="cs" checked> Colour the track by speed</label><label><input type="checkbox" id="xo"> X-ray piece <select id="xs"></select></label><label>t <input type="range" id="xt" min="0" max="1" step="0.05" value="0.5"></label><label>Arrows at joins <select id="am"><option value="f1">f′</option><option value="f2">f″</option><option value="none">none</option></select></label><label>Graph <select id="gm"><option value="1">speed</option><option value="2">size of f″</option></select></label>`;

    setTimeout(()=>{$('cs').onchange=e=>{this.colour=e.target.checked;this.render();};$('xo').onchange=e=>{this.xr=e.target.checked;this.render();};$('xt').oninput=e=>{this.tx=parseFloat(e.target.value);this.render();};$('xs').onchange=e=>{this.sel=parseInt(e.target.value);this.render();};$('am').onchange=e=>{this.am=e.target.value;this.render();};$('gm').onchange=e=>{this.gm=parseInt(e.target.value);this.render();};},0);
  },
  joins(){const J=[];for(let i=1;i<this.pieces.length;i++)J.push(i);return J;},
  info(i){const p=this.pieces,inf=joinInfo(sub(p[i-1][3],p[i-1][2]),sub(p[i][1],p[i][0]));inf.c2=inf.c1&&len(sub(d2e(p[i-1]),d2s(p[i])))<=0.3;return inf;},

  /* the train reaches the end of the track: go back to the start and keep riding */
  onEnd(){
    const n=this.pieces.length;
    if(n>=4&&this.joins().every(i=>this.info(i).c1)){this.got.m3=true;this.toast={j:0,text:'lap complete ✓',cls:'lblg',until:performance.now()+1800};}
    if(n>=3&&this.joins().every(i=>this.info(i).c2)){this.got.m4=true;this.toast={j:0,text:'lap complete ✓',cls:'lblg',until:performance.now()+1800};}
    return true;
  },
  step(){
    const st=this.st;if(!st)return;const prev=st.prev===undefined?0:st.prev;st.prev=st.tau;
    if(!st.playing||this.fx)return;
    const T=this.T;
    for(const i of this.joins()){
      if(prev<i*T&&st.tau>=i*T){
        const inf=this.info(i),now=performance.now(),p=this.pieces;
        if(!inf.g1){this.startFx(i);return;}
        if(!inf.c1)this.toast={j:i,text:'Lurch! speed '+fmt(len(sub(p[i-1][3],p[i-1][2])))+' → '+fmt(len(sub(p[i][1],p[i][0]))),cls:'lblw',until:now+2200};
        else this.toast={j:i,text:'smooth ✓',cls:'lblg',until:now+1200};
        setTimeout(()=>{if(levels[cur]===LP)this.render();},2300);
      }
    }
  },
  startFx(j){
    const st=this.st,pcs=this.pieces;st.playing=false;st.btn.textContent='▶ Ride';stopAnim();
    const P=pcs[j-1];st.tau=j*this.T;
    this.fx={j,pos:P[3],h:dbez(P,1),t0:performance.now(),dur:2200};
    const s=this;const loop=()=>{if(levels[cur]!==LP||!s.fx)return;const u=(performance.now()-s.fx.t0)/s.fx.dur;
      if(u>=1){s.fx=null;st.tau=0;st.prev=0;st.rng.value=0;s.render();return;}s.render();requestAnimationFrame(loop);};

  drawFx(){
    const f=this.fx,u=Math.min(1,(performance.now()-f.t0)/f.dur);
    const x0=X(f.pos[0]),y0=Y(f.pos[1]);let d=[f.h[0],-f.h[1]];const L=Math.hypot(d[0],d[1])||1;d=[d[0]/L,d[1]/L];

    const star=(cx,cy,r,col,op)=>{const pts=[];for(let k=0;k<16;k++){const a=k*Math.PI/8,rr=k%2?r*.5:r;pts.push((cx+Math.cos(a)*rr)+','+(cy+Math.sin(a)*rr));}
      el('polygon',{points:pts.join(' '),fill:col,opacity:op,stroke:'var(--bad)','stroke-width':2});};

    el('circle',{cx:x0,cy:y0,r:16,fill:'none',stroke:'var(--bad)','stroke-width':4});
    word(x0,y0-64,'OOPS!',38);
    el('text',{x:x0,y:y0+46,class:'lblb','text-anchor':'middle'},board,'corner at this join');
  },
  fit(){const pcs=this.pieces;let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    pcs.forEach(P=>P.forEach(p=>{mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1]);}));
    const w=Math.max(mxx-mnx+6,(mxy-mny+6)*W/H,14);this.v={cx:(mnx+mxx)/2,cy:(mny+mxy)/2,w:Math.ceil(w)};this.fitted=true;},
  missions(){
    const g=this.got,J=this.joins().map(i=>this.info(i));
    if(J.some(i=>!i.g1))g.m1=true;
    if(J.some(i=>i.g1&&!i.c1))g.m2=true;
    const row=(ok,t)=>`<li style="list-style:none">${ok?'<b class="ok">✓</b>':'○'} ${t}</li>`;
    $('ms').innerHTML=`<ul class="facts" style="padding-left:4px">${row(g.m1,'<b>Mission 1.</b> Make a <b>corner</b>: drag a handle next to a join so the blue and purple arrows there point in different directions. The train will derail.')}${row(g.m2,'<b>Mission 2.</b> Make a <b>G¹-only</b> join: the two arrows point the same way but have different lengths. Ride and watch the speed graph.')}${row(g.m3,'<b>Mission 3.</b> Build a track of <b>at least 4 pieces</b> where <b>every</b> join is C¹ (the arrows coincide), and ride it end to end.')}${row(g.m4,'<b>Mission 4.</b> Build a track of <b>at least 3 pieces</b> where <b>every</b> join is <b>C²</b>, and ride it end to end. Set <b>Arrows at joins</b> to f″: make a join C¹ first, then move the second handle of the next piece until the f″ arrows coincide.')}</ul>`;
  },
  render(){
    const pcs=this.pieces,n=pcs.length;if(!this.fitted)this.fit();view=this.v;
    clearBoard();drawGrid();this.missions();
    const cls=['curve','curve2','curve3'];
    pcs.forEach(P=>poly(P,'poly'));
    let vmax=1;pcs.forEach(P=>{for(let k=0;k<=40;k++)vmax=Math.max(vmax,len(dbez(P,k/40))/this.T);});
    pcs.forEach((P,i)=>{
      if(this.colour){for(let k=0;k<40;k++){const a=bez(P,k/40),b=bez(P,(k+1)/40),v=len(dbez(P,(k+.5)/40))/this.T,fr=Math.min(1,v/vmax);
        seg(a,b,'',{stroke:`rgb(${Math.round(47+(234-47)*fr)},${Math.round(91+(88-91)*fr)},${Math.round(234+(12-234)*fr)})`,'stroke-width':6,'stroke-linecap':'round'});}}
      else path(P,cls[i%3]);});
    if(this.xr){const P=pcs[Math.min(this.sel,n-1)],c=casteljau(P,this.tx);poly(c[1],'xr1');poly(c[2],'xr2');dot_(c[3][0],9,'train');label(c[3][0],pf(c[3][0]),0,-16,'lblg','middle');}
    if(this.am!=='none'){const o=this.am==='f1';this.joins().forEach(i=>{const J=pcs[i][0],a=o?dbez(pcs[i-1],1):d2e(pcs[i-1]),b=o?dbez(pcs[i],0):d2s(pcs[i]),k=Math.min(o?.25:.12,5/Math.max(len(a),len(b),1e-9));
      arrow(J,add(J,mul(a,k)),'var(--accent)',6);arrow(J,add(J,mul(b,k)),'var(--purple)',3.5);});}
    /* train first, so the dots stay on top and can always be grabbed */
    const tau=this.st?this.st.tau:0,T=this.T;let speed=0,tp=null;
    if(!this.fx){trainOnTrack(pcs,tau,T);
      const i=Math.max(0,Math.min(n-1,Math.floor(Math.max(0,tau)/T))),t=Math.min(1,Math.max(0,(Math.max(0,tau)-i*T)/T));speed=len(dbez(pcs[i],t))/T;tp=bez(pcs[i],t);}
    else this.drawFx();
    const sq=(pt,id,size)=>{const x=X(pt[0]),y=Y(pt[1]);el('rect',{x:x-size/2,y:y-size/2,width:size,height:size,rx:4,class:'hd','data-h':id});const m=MS()*5;el('rect',{x:x-size/2-m,y:y-size/2-m,width:size+2*m,height:size+2*m,class:'hit','data-h':id});};
    const jl=[];
    this.joins().forEach(i=>{const P=pcs[i],inf=this.info(i),[bt,bc]=this.badge(inf);
      sq(P[0],i+':0',26);
      if(!this.fx)label(P[0],bt,16,36,bc==='ok'?'lblg':bc==='mid'?'lblw':'lblb');
      const hi=sub(pcs[i-1][3],pcs[i-1][2]),ho=sub(P[1],P[0]);jl.push(`<div>Join ${i}: <span class="${bc}">${bt}</span><br><span class="tiny">f′ before ${pf(dbez(pcs[i-1],1))}, after ${pf(dbez(P,0))} &nbsp;·&nbsp; f″ before ${pf(d2e(pcs[i-1]))}, after ${pf(d2s(P))}</span></div>`);});
    sq(pcs[0][0],'0:0',20);sq(pcs[n-1][3],(n-1)+':3',20);
    label(pcs[0][0],'start',-14,30,'lbl','end');label(pcs[n-1][3],'end',14,-16,'lbl');
    pcs.forEach((P,i)=>{[1,2].forEach(k=>handle(i+':'+k,P[k]));});
    if(tp&&!this.fx)label(tp,fmt(speed),0,-24,'lblg','middle');
    const sx=$('xs');if(sx&&sx.options.length!==n){sx.innerHTML=pcs.map((_,i)=>`<option value="${i}">${i+1}</option>`).join('');sx.value=Math.min(this.sel,n-1);}
    if(this.toast&&performance.now()<this.toast.until){const P=this.toast.j===0?pcs[0][0]:pcs[this.toast.j][0];label(P,this.toast.text,16,-20,this.toast.cls);}
    if(this.st)this.st.rng.max=n*this.T;
    speedGraph(pcs,tau,T,this.gm);
    $('readout').innerHTML=`<div>Train speed now: <b>${fmt(speed)}</b> <span class="tiny">(length of the velocity vector per second: it changes along every piece, see the graph.)</span></div>`+(jl.join('')||'<div class="tiny">Add a piece to get a join.</div>');
  },
  moveEnd(i,k,p){const P=this.pieces[i],d=sub(p,P[k]);P[k]=p;const h=k===0?1:2;P[h]=add(P[h],d);},
  onDrag(id,p){
    const [i,k]=id.split(':').map(Number),pcs=this.pieces,n=pcs.length,P=pcs[i];
    if(k===0||k===3){
      this.moveEnd(i,k,p);
      if(k===0&&i>0)this.moveEnd(i-1,3,p);
      if(k===3&&i<n-1)this.moveEnd(i+1,0,p);
      return;
    }
    P[k]=p;
  }
};

const levels=[LD,L2,L3,L5,LP];
buildSteps();go(0);
</script>
