<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityLab Flythrough</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#18213d; --muted:#5b6785; --line:#d9deea;
  --accent:#2f5bea; --accent-soft:#e3eaff; --good:#15803d; --good-soft:#dcf5e5;
  --warn:#c2410c; --warn-soft:#ffe9dc; --bad:#b91c1c; --bad-soft:#fde2e2;
  --grid:#e6eaf3; --axis:#aab3c8; --board:#ffffff; --purple:#7c3aed; --teal:#0f766e;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1424; --card:#171d33; --ink:#e8ecf8; --muted:#9aa6c4; --line:#2a3354;
    --accent:#7b9bff; --accent-soft:#222c54; --good:#5fd18a; --good-soft:#143524;
    --warn:#ffa56b; --warn-soft:#3a2416; --bad:#ff8b8b; --bad-soft:#3d1a1a;
    --grid:#222a47; --axis:#4a557c; --board:#121830; --purple:#b69cff; --teal:#4fd1c5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:18px 20px 6px;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{margin:2px 0 12px;color:var(--muted)}
#steps{display:flex;flex-wrap:wrap;gap:8px}
#steps button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
#steps button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
#steps button.done::after{content:" ✓";color:var(--good);font-weight:700}
#steps button.cur.done::after{color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;max-width:1280px;margin:0 auto;padding:10px 20px 30px}
@media (max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
#boardwrap{padding:8px}
svg{display:block;width:100%;height:auto}
#board{background:var(--board);border-radius:10px;touch-action:none;user-select:none}
#graph{margin-top:8px;background:var(--board);border-radius:10px}
#panel h2{margin:0 0 4px;font-size:21px}
#panel .goal{margin:0 0 8px;font-size:16px}
.formula{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
.facts{margin:8px 0;padding-left:20px}
.facts li{margin:3px 0}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0}
.row label{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:15px;max-width:100%}
.row select{max-width:100%}
input[type=number]{width:84px;font:inherit;font-size:16px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=range]{width:200px}
select{font:inherit;font-size:15px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.readout{font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.readout div{margin:2px 0}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.mid{color:var(--warn);font-weight:600}
#fb{margin:8px 0;padding:0}
#fb .msg{border-radius:10px;padding:9px 12px;font-size:15.5px}
#fb .good{background:var(--good-soft);color:var(--good)}
#fb .bad{background:var(--bad-soft);color:var(--bad)}
#fb .info{background:var(--warn-soft);color:var(--warn)}
#hints,#working,#note{margin:8px 0}
#hints .hh{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.btn.small{padding:2px 10px;font-size:13px}
.mine{stroke:var(--purple);stroke-width:3.5;stroke-dasharray:9 6;fill:none}
#hints .h{background:var(--warn-soft);border-radius:10px;padding:7px 12px;margin:6px 0;font-size:15px}
#working .w{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:15px}
#note .n{border-left:4px solid var(--good);padding:4px 12px;font-size:15.5px;background:var(--good-soft);border-radius:0 10px 10px 0}
#working ol{margin:4px 0;padding-left:20px}
sub{font-size:.75em}
/* svg */
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1.6}
.tick{fill:var(--muted);font-size:13px}
.poly{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 5;fill:none}
.curve{stroke:var(--accent);stroke-width:4.5;fill:none;stroke-linecap:round}
.curve2{stroke:var(--purple);stroke-width:4.5;fill:none;stroke-linecap:round}
.curve3{stroke:var(--teal);stroke-width:4.5;fill:none;stroke-linecap:round}
.ghost{stroke:var(--muted);stroke-width:2;fill:none;opacity:.55}
.cp{fill:var(--ink)}
.hd{fill:var(--warn);stroke:var(--card);stroke-width:2.5;cursor:grab}
.hit{fill:transparent;cursor:grab}
.lbl{fill:var(--ink);font-size:17px;font-weight:600;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblm{fill:var(--muted);font-size:15px;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblg{fill:var(--good);font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblw{fill:var(--warn);font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lblb{fill:var(--bad);font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.gate{fill:none;stroke:var(--warn);stroke-width:3.5}
.guess{fill:none;stroke:var(--bad);stroke-width:3.5}
.train{fill:var(--accent);stroke:var(--card);stroke-width:2.5}
.xr1{stroke:#ea580c;stroke-width:2.5;fill:none}
.xr2{stroke:#16a34a;stroke-width:2.5;fill:none}
.xr3{stroke:#9333ea;stroke-width:3;fill:none}
.chord{stroke:var(--bad);stroke-width:3.5;fill:none}
.spd{stroke:var(--accent);stroke-width:3;fill:none}
.sel{stroke-width:6}
.tiny{font-size:13px;color:var(--muted)}
details>summary{cursor:pointer;margin:4px 0}
@media (max-width:700px){
  header{padding:14px 14px 4px} h1{font-size:22px} main{padding:8px 12px 24px;gap:12px}
  .card{padding:12px}
  .tick{font-size:21px}.lbl,.lblg,.lblw,.lblb{font-size:25px;stroke-width:6px}.lblm{font-size:21px;stroke-width:6px}
  .btn{padding:10px 16px}
  input[type=range]{width:min(200px,60vw)}
}

/* ---- additions for the flythrough page ---- */
#steps{align-items:center}
#steps .grp{font-size:13px;color:var(--muted);margin:0 2px 0 8px;text-transform:uppercase;letter-spacing:.06em}
#steps .grp:first-child{margin-left:0}
#steps button .st{color:var(--warn);letter-spacing:1px;font-size:12px;margin-left:4px}
#steps button.cur .st{color:#fff}
.seg{stroke-width:4.5;fill:none;stroke-linecap:round}
.seg.ok{stroke:var(--accent)}
.seg.moved{stroke:var(--bad)}
.seg.cr{stroke:var(--accent)}
.seg.bs{stroke:var(--purple)}
.seg.out{stroke:var(--bad)}
.knot{fill:var(--card);stroke:var(--muted);stroke-width:2}
.gate.ok{stroke:var(--good)}
.gatefill{fill:var(--warn-soft);opacity:.55}
.gatefill.ok{fill:var(--good-soft)}
.wall{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2.5}
.band{fill:var(--good-soft);opacity:.55;stroke:none}
.lock{fill:var(--muted);stroke:var(--card);stroke-width:2}
.miss{stroke:var(--bad);stroke-width:3;stroke-dasharray:4 3}
.head{stroke:var(--muted);stroke-width:2;stroke-dasharray:8 6;fill:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bar{height:14px;border-radius:7px;background:var(--grid);position:relative;overflow:hidden;margin:4px 0 2px}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.bar>i.over{background:var(--bad)}
.bar>b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;vertical-align:middle;margin-right:6px}
.tiny b{color:var(--ink)}
@media (max-width:700px){
  #steps button{padding:8px 12px}
  #steps .grp{display:none}
}
.step{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
#ride{margin:0 0 10px}
.rides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rides figure{margin:0}
.rides canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--grid)}
.rides figcaption{font-weight:700;font-size:15px;margin-top:2px}
.transport{display:flex;gap:8px;align-items:center;margin:8px 0 0}
.transport input[type=range]{flex:1}
.transport select{font-size:15px;padding:4px}
.mh{font-size:15px;margin:10px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist .mrow{text-align:left;display:flex;gap:8px;align-items:center}
.mlist .mrow .cb{font-size:18px;line-height:1}
</style>
</head>
<body>
<header>
  <h1>CityLab Flythrough</h1>
  <p class="sub">Design the camera path through the city. Three short activities, then the City ride playground with missions. No timer: drag, check, and see what happens.</p>
  <nav id="steps"></nav>
  <p class="tiny" style="margin:8px 0 0"><button class="btn" id="bReset" style="padding:2px 8px;font-size:12px">Clear progress</button></p>
</header>
<main>
  <section class="card" id="boardwrap">
    <div id="ride" style="display:none"></div>
    <svg id="board" viewBox="0 0 760 560" role="img" aria-label="Camera path drawing board"></svg>
    <svg id="graph" viewBox="0 0 760 170" style="display:none" role="img" aria-label="Strip plot under the board"></svg>
  </section>
  <aside class="card" id="panel">
    <h2 id="title"></h2>
    <div id="story"></div>
    <div id="inputs"></div>
    <div id="readout"></div>
    <div id="fb"></div>
    <div class="btns" id="btns">
      <button class="btn primary" id="bCheck">Check</button>
      <button class="btn" id="bHint">Hint</button>
      <button class="btn" id="bWork">Formulas</button>
      <button class="btn" id="bNext" style="display:none">Next →</button>
    </div>
    <div id="hints"></div>
    <div id="working"></div>
    <div id="note"></div>
  </aside>
</main>
<script>
/* ---------------------------------------------------------------- pure math (no DOM) */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]), lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
const clone=P=>P.map(p=>p.slice());
function bez(P,t){const u=1-t;return [0,1].map(i=>u*u*u*P[0][i]+3*t*u*u*P[1][i]+3*t*t*u*P[2][i]+t*t*t*P[3][i]);}
function dbez(P,t){const u=1-t;return [0,1].map(i=>3*u*u*(P[1][i]-P[0][i])+6*u*t*(P[2][i]-P[1][i])+3*t*t*(P[3][i]-P[2][i]));}
function d2bez(P,t){return [0,1].map(i=>(6-6*t)*P[0][i]+(-12+18*t)*P[1][i]+(6-18*t)*P[2][i]+6*t*P[3][i]);}
/* one Bezier curve of any degree by de Casteljau */
function bezN(P,t){let Q=P;while(Q.length>1){const R=[];for(let i=0;i<Q.length-1;i++)R.push(lerp(Q[i],Q[i+1],t));Q=R;}return Q[0];}
/* Hermite piece -> Bezier points */
function hermiteSeg(p0,d0,p1,d1){return [p0,add(p0,mul(d0,1/3)),sub(p1,mul(d1,1/3)),p1];}
/* Catmull-Rom / cardinal: tangent d_k = 1/2 (1-t) (p_{k+1} - p_{k-1}) */
function cardTan(pm,pp,ten){return mul(sub(pp,pm),0.5*(1-ten));}
function segsCR(p,ten,closed){
  const n=p.length,S=[],at=i=>p[((i%n)+n)%n];
  const lo=closed?0:1,hi=closed?n-1:n-3;
  for(let k=lo;k<=hi;k++){
    const a=at(k-1),b=at(k),c=at(k+1),d=at(k+2);
    S.push(hermiteSeg(b,cardTan(a,c,ten),c,cardTan(b,d,ten)));
  }
  return S;
}
/* uniform cubic B-spline segment as a Bezier piece */
function bsBez(P0,P1,P2,P3){
  const f=(a,b,c,d,w)=>[0,1].map(i=>(w[0]*a[i]+w[1]*b[i]+w[2]*c[i]+w[3]*d[i]));
  return [f(P0,P1,P2,P3,[1/6,4/6,1/6,0]),f(P0,P1,P2,P3,[0,2/3,1/3,0]),f(P0,P1,P2,P3,[0,1/3,2/3,0]),f(P0,P1,P2,P3,[0,1/6,4/6,1/6])];
}
function segsBS(p,closed){
  const n=p.length,S=[],at=i=>p[((i%n)+n)%n],m=closed?n:n-3;
  for(let j=0;j<m;j++)S.push(bsBez(at(j),at(j+1),at(j+2),at(j+3)));
  return S;
}
function segsChain(p){const S=[];for(let j=0;j+3<p.length;j+=3)S.push([p[j].slice(),p[j+1].slice(),p[j+2].slice(),p[j+3].slice()]);return S;}
/* B-spline weights at u (sum to 1) */
const bsW=u=>[(1-u)**3/6,(3*u**3-6*u*u+4)/6,(-3*u**3+3*u*u+3*u+1)/6,u**3/6];
/* sample a list of Bezier pieces: returns [{seg,t,pt}] */
function sampleSegs(S,per){const out=[];S.forEach((P,i)=>{for(let k=0;k<=per;k++){const t=k/per;out.push({seg:i,t,pt:bez(P,t)});}});return out;}
function sampleHigh(p,N){const out=[];for(let k=0;k<=N;k++){const t=k/N;out.push({seg:0,t,pt:bezN(p,t)});}return out;}
/* min distance from curve samples to a centre */
function minDist(samples,c){let m=1e9;for(const s of samples){const d=len(sub(s.pt,c));if(d<m)m=d;}return m;}
/* size of the jump in f'' at each interior join */
function jumps(S){const J=[];for(let i=1;i<S.length;i++){J.push(len(sub(d2bez(S[i-1],1),d2bez(S[i],0))));}return J;}
function d1jumps(S){const J=[];for(let i=1;i<S.length;i++){J.push(len(sub(dbez(S[i-1],1),dbez(S[i],0))));}return J;}
function polylineLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=len(sub(pts[i],pts[i-1]));return L;}
/* fraction of route (by length) that moved more than tol, comparing sample by sample */
function movedFraction(oldS,newS,tol){
  let tot=0,mv=0;
  for(let i=1;i<oldS.length;i++){
    const w=len(sub(oldS[i].pt,oldS[i-1].pt));tot+=w;
    const d=Math.max(len(sub(oldS[i].pt,newS[i].pt)),len(sub(oldS[i-1].pt,newS[i-1].pt)));
    if(d>tol)mv+=w;
  }
  return tot>0?mv/tot:0;
}
function segsMoved(oldS,newS,tol){
  const per=oldS.length/ (1); // not used
  return 0;
}
if(false)module.exports={add,sub,mul,len,lerp,dot,cross,clone,bez,dbez,d2bez,bezN,hermiteSeg,cardTan,segsCR,bsBez,segsBS,segsChain,bsW,sampleSegs,sampleHigh,minDist,jumps,d1jumps,polylineLen,movedFraction};

'use strict';
/* ------------------------------------------------------------------ helpers */
const NS='http://www.w3.org/2000/svg', W=760, H=560;
const board=document.getElementById('board'), graph=document.getElementById('graph');
const $=id=>document.getElementById(id);
const fmt=n=>{const r=Math.round(n*1000)/1000;return (Object.is(r,-0)?0:r).toString()};
const f1=n=>(Math.round(n*100)/100).toString();
const pf=p=>'('+fmt(p[0])+', '+fmt(p[1])+')';
const snapv=(v,s)=>Math.round(v/s)*s;
const deg=r=>r*180/Math.PI;
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;(parent||board).appendChild(e);return e;}

let view={cx:6,cy:3,w:14};
const vh=()=>view.w*H/W;
const X=x=>(x-(view.cx-view.w/2))/view.w*W;
const Y=y=>H-(y-(view.cy-vh()/2))/vh()*H;
const WX=px=>px/W*view.w+(view.cx-view.w/2);
const WY=py=>(H-py)/H*vh()+(view.cy-vh()/2);
const PX=r=>r/view.w*W;                       /* world length -> pixels */
const MS=()=>(window.matchMedia&&window.matchMedia('(max-width:700px)').matches)?1.7:1;

function clearBoard(){while(board.firstChild)board.removeChild(board.firstChild);}
function drawGrid(){
  const x0=view.cx-view.w/2,x1=view.cx+view.w/2,h=vh(),y0=view.cy-h/2,y1=view.cy+h/2;
  const step=view.w>16?2:1;
  for(let x=Math.ceil(x0);x<=x1;x++){ if(x%step)continue; el('line',{x1:X(x),y1:0,x2:X(x),y2:H,class:x===0?'axis':'grid'});
    el('text',{x:X(x)+3,y:H-6,class:'tick'},board,String(x)); }
  for(let y=Math.ceil(y0);y<=y1;y++){ if(y%step)continue; el('line',{x1:0,y1:Y(y),x2:W,y2:Y(y),class:y===0?'axis':'grid'});
    el('text',{x:4,y:Y(y)-4,class:'tick'},board,String(y)); }
}
function segPath(P,cls){return el('path',{d:`M${X(P[0][0])} ${Y(P[0][1])} C${X(P[1][0])} ${Y(P[1][1])}, ${X(P[2][0])} ${Y(P[2][1])}, ${X(P[3][0])} ${Y(P[3][1])}`,class:cls});}
function polyline(pts,cls){return el('polyline',{points:pts.map(p=>X(p[0])+','+Y(p[1])).join(' '),class:cls});}
function seg(a,b,cls,extra){return el('line',Object.assign({x1:X(a[0]),y1:Y(a[1]),x2:X(b[0]),y2:Y(b[1]),class:cls},extra||{}));}
function dotAt(p,r,cls){return el('circle',{cx:X(p[0]),cy:Y(p[1]),r:r,class:cls});}
function label(p,txt,dx,dy,cls,anchor){
  const t=el('text',{x:X(p[0])+(dx||0),y:Y(p[1])+(dy||0),class:cls||'lbl','text-anchor':anchor||'start'},board);
  const re=/_\{([^}]*)\}|_([A-Za-z0-9])/g;let last=0,m,afterSub=false;
  const plain=str=>{if(!str)return;const a={};if(afterSub){a.dy='-0.252em';afterSub=false;}el('tspan',a,t,str);};
  while((m=re.exec(txt))){plain(txt.slice(last,m.index));el('tspan',{'font-size':'0.72em',dy:'0.35em'},t,m[1]!==undefined?m[1]:m[2]);afterSub=true;last=re.lastIndex;}
  plain(txt.slice(last));return t;
}
function cameraIcon(p,angDeg,color,coneLen){
  const L=(coneLen||70)*Math.min(MS(),1.4),k=Math.tan(22*Math.PI/180)*L;
  const g=el('g',{transform:`translate(${X(p[0])} ${Y(p[1])}) rotate(${-angDeg})`});
  el('polygon',{points:`10,0 ${L},${-k} ${L},${k}`,fill:color,opacity:0.18},g);
  el('line',{x1:10,y1:0,x2:L,y2:-k,stroke:color,'stroke-width':1.5,opacity:0.5},g);el('line',{x1:10,y1:0,x2:L,y2:k,stroke:color,'stroke-width':1.5,opacity:0.5},g);
  el('rect',{x:-14,y:-9,width:24,height:18,rx:3,fill:color},g);
  el('polygon',{points:'10,-5 20,-10 20,10 10,5',fill:color},g);
  el('circle',{cx:-3,cy:0,r:4,fill:'#fff'},g);
}
function handle(id,p){const m=MS();el('circle',{cx:X(p[0]),cy:Y(p[1]),r:11*Math.min(m,1.35),class:'hd','data-h':id});el('circle',{cx:X(p[0]),cy:Y(p[1]),r:23*m,class:'hit','data-h':id});}

function arrow(a,b,color,width){
  const A=[X(a[0]),Y(a[1])],B=[X(b[0]),Y(b[1])],d=[B[0]-A[0],B[1]-A[1]],L=Math.hypot(d[0],d[1]); if(L<2)return;
  const u=[d[0]/L,d[1]/L],n=[-u[1],u[0]],s=11;
  el('line',{x1:A[0],y1:A[1],x2:B[0]-u[0]*s*.6,y2:B[1]-u[1]*s*.6,stroke:color,'stroke-width':width||3.5,'stroke-linecap':'round'});
  el('polygon',{points:`${B[0]},${B[1]} ${B[0]-u[0]*s*1.4+n[0]*s*.6},${B[1]-u[1]*s*1.4+n[1]*s*.6} ${B[0]-u[0]*s*1.4-n[0]*s*.6},${B[1]-u[1]*s*1.4-n[1]*s*.6}`,fill:color});

function niceStep(v){const k=Math.pow(10,Math.floor(Math.log10(v/4)));const r=(v/4)/k;return (r<=1?1:r<=2?2:r<=5?5:10)*k;}
function strip(S,o){
  while(graph.firstChild)graph.removeChild(graph.firstChild);
  const n=S.length,L=56,R=748,top=14,bot=140; if(!n)return;
  const vec=o.order===1?dbez:d2bez;
  let vmax=o.ymax||0;const curves=[];
  S.forEach((P,i)=>{const pts=[];for(let k=0;k<=60;k++){const t=k/60,v=len(vec(P,t));pts.push([i+t,v]);if(!o.ymax)vmax=Math.max(vmax,v);}curves.push(pts);});
  vmax=o.ymax||Math.max(1,Math.ceil(vmax*1.15));
  const gx=s=>L+(s/n)*(R-L),gy=v=>bot-(Math.min(v,vmax)/vmax)*(bot-top);
  el('line',{x1:L,y1:bot,x2:R,y2:bot,class:'axis'},graph);el('line',{x1:L,y1:top,x2:L,y2:bot,class:'axis'},graph);
  el('text',{x:R,y:top+4,class:'tick','text-anchor':'end'},graph,o.name);el('text',{x:R,y:bot+22,class:'tick','text-anchor':'end'},graph,'time →');
  const st=niceStep(vmax);for(let v=0;v<=vmax+1e-9;v+=st){el('line',{x1:L,y1:gy(v),x2:R,y2:gy(v),class:'grid'},graph);el('text',{x:L-8,y:gy(v)+5,class:'tick','text-anchor':'end'},graph,fmt(v));}
  for(let i=1;i<n;i++){el('line',{x1:gx(i),y1:top,x2:gx(i),y2:bot,stroke:'var(--muted)','stroke-dasharray':'4 4','stroke-width':1.2},graph);}
  curves.forEach(pts=>el('polyline',{points:pts.map(s=>gx(s[0])+','+gy(s[1])).join(' '),class:'spd'},graph));
  if(o.order===2){for(let i=1;i<n;i++){const a=d2bez(S[i-1],1),b=d2bez(S[i],0);if(len(sub(a,b))>o.tol){el('line',{x1:gx(i),y1:gy(len(a)),x2:gx(i),y2:gy(len(b)),stroke:'var(--bad)','stroke-width':3.5},graph);}}}
  if(o.line!==undefined){el('line',{x1:L,y1:gy(o.line),x2:R,y2:gy(o.line),stroke:'var(--bad)','stroke-width':2.5,'stroke-dasharray':'8 5'},graph);el('text',{x:L+6,y:gy(o.line)-6,class:'tick',style:'fill:var(--bad)'},graph,o.lineName);}
}

function routeOf(scheme,pts,o){
  o=o||{};

  const S=scheme==='cr'?segsCR(pts,o.ten||0,o.closed):scheme==='bs'?segsBS(pts,o.closed):segsChain(pts);
  return {S,high:false,samples:sampleSegs(S,50)};
}
function drawRoute(r,cls,flags){

  else{drawSegs(r.S,cls,flags);}
}
function chainBase(p){const q=clone(p);for(const j of [3,6,9]){if(j+1>=p.length)continue;const m=mul(sub(p[j+1],p[j-1]),0.5);q[j-1]=sub(p[j],m);q[j+1]=add(p[j],m);}return q;}

}

  const J=d1jumps(S);for(let i=0;i<J.length;i++)if(J[i]>0.05)return i+1;return 0;

/* ---------------------------------------------------------------- 3. Local control: fix one landmark */

    const gg=el('g',{transform:`translate(${X(st.pos[0])} ${Y(st.pos[1])}) rotate(${-st.th*180/Math.PI})`},g);
    const L=60,kk=Math.tan(22*Math.PI/180)*L;
    el('polygon',{points:`8,0 ${L},${-kk} ${L},${kk}`,fill:c,opacity:.2},gg);
    el('rect',{x:-11,y:-7,width:19,height:14,rx:3,fill:c},gg);el('polygon',{points:'8,-4 16,-8 16,8 8,4',fill:c},gg);});
}
/* ---- challenges ---- */
const CHAL=[
  {name:'Free play',text:'Drag the orange points. Both cameras ride the same points: Catmull–Rom (blue) and B-spline (purple). Watch the ball on each dashboard: it is pushed by the camera’s acceleration, f″. The strip under the map shows how much f″ jumps at each join. Nothing is graded here. Try the missions below when you are ready.'},
  {name:'Visit the landmarks',text:'<b>Mission 1.</b> Make <b>both</b> routes pass through the two circles, at the Tower corner and the Station corner. Drag the corner points, then press <b>Check</b>.',gates:[{n:'Tower',c:[15,6],r:0.5},{n:'Station',c:[15,12],r:0.5}]},
  {name:'No push',text:`<b>Mission 2.</b> Make the ball <b>never jump by more than ${JUMP_LIMIT}</b> on both routes. A <b>jump</b> is the change in f″ at a join: the length of (f″ at the end of one piece − f″ at the start of the next). On the strip, each bar shows the size of the jump at one join for one route; a red outline means it is over the limit. Use <b>Add a point</b> and <b>Check</b>.`},
  {name:'Park tour',text:'<b>Mission 3.</b> Both routes must <b>start at the depot</b> heading north, <b>pass through the fountain</b> in the park, and <b>end at the harbor</b> heading east. Start from the same route as before and reshape it, then press <b>Check</b>.',gates:[{n:'depot',c:[7.5,1],r:0.5},{n:'fountain',c:[3.75,9],r:0.5},{n:'harbor',c:[22,12],r:0.5}]}
];
const CHAL_HINTS=[[],
  ['Catmull–Rom passes through every point you place, so check which route misses.','A B-spline curve does not pass through its points: at a corner it cuts inside. Where should the guide go so the curve reaches the circle?','At a corner the B-spline curve lies about 1/6 of the way back from the guide toward its neighbours. Move the corner point outward.'],
  ['Look at the strip: where is the red mark, and on which curve?','A B-spline has C²: its f″ has no jump. What about Catmull–Rom?','For Catmull–Rom, round every corner: one point before it, one on the bend and one after it, so that the turn is spread out.','The limit is tight. Place the three points of each corner close to a smooth arc and keep the gaps between neighbouring points similar.'],
  ['Catmull–Rom passes through every point. Which of your points is closest to the fountain?','A B-spline curve cuts inside every turn, so a single point at the fountain is not enough for it.','Make a pocket: one point on each side of the fountain, further out, plus one at the fountain. Keep the first and last points on the street, so the route still starts at the depot and ends at the harbor.','If a route no longer starts at the depot or ends at the harbor, use + point before the start and + point after the end.']
];
function chalEval(){
  const R=cityRoutes(),res={};
  ['cr','bs'].forEach(k=>{
    const r=R[k],o={ok:false,lines:[]};
    if(!r.S.length){res[k]=o;return;}
    if(CITY.chal===1){const ds=CHAL[1].gates.map(g=>minDist(r.samples,g.c));o.lines=CHAL[1].gates.map((g,i)=>`${g.n} ${ds[i]<=g.r?'✓':'✗ (misses by '+f1(ds[i]-g.r)+')'}`);o.ok=ds.every((d,i)=>d<=CHAL[1].gates[i].r);}
    if(CITY.chal===2){const J=jumps(r.S),mx=J.length?Math.max(...J):0;o.lines=[`biggest jump ${f1(mx)} (limit ${JUMP_LIMIT})`];o.ok=mx<=JUMP_LIMIT;}
    if(CITY.chal===3){const a=r.S[0][0],b=r.S[r.S.length-1][3],d0=dbez(r.S[0],0),d1=dbez(r.S[r.S.length-1],1);
      const g=CHAL[3].gates,da=len(sub(a,g[0].c)),db=len(sub(b,g[2].c)),df=minDist(r.samples,g[1].c),ha=Math.abs(deg(Math.atan2(d0[1],d0[0]))-90),hb=Math.abs(deg(Math.atan2(d1[1],d1[0])));
      o.lines=[`depot ${da<=g[0].r&&ha<=12?'✓':'✗'}`,`fountain ${df<=g[1].r?'✓':'✗ (misses by '+f1(df-g[1].r)+')'}`,`harbor ${db<=g[2].r&&hb<=12?'✓':'✗'}`];
      o.ok=da<=g[0].r&&db<=g[2].r&&ha<=12&&hb<=12&&df<=g[1].r;o.df=df;o.sd=da<=g[0].r&&ha<=12;o.ed=db<=g[2].r&&hb<=12;}
    o.hit=r.hit;if(CITY.chal>0&&r.hit){o.ok=false;o.lines.push('goes through a building');}
    res[k]=o;
  });
  return res;
}
function stripTwo(R){
  while(graph.firstChild)graph.removeChild(graph.firstChild);
  const L=56,Rr=748,top=22,bot=140,n=R.cr.S.length;if(!n)return;
  const nj=Math.max(1,n-1),w=(Rr-L)/nj,cx=i=>L+(i-0.5)*w;
  const J={cr:jumps(R.cr.S),bs:jumps(R.bs.S)};
  let vmax=Math.max(JUMP_LIMIT*1.5,...J.cr,...J.bs);vmax=Math.ceil(vmax*1.1/2)*2;
  const gy=v=>bot-(Math.min(v,vmax)/vmax)*(bot-top);
  el('line',{x1:L,y1:bot,x2:Rr,y2:bot,class:'axis'},graph);el('line',{x1:L,y1:top,x2:L,y2:bot,class:'axis'},graph);
  el('text',{x:Rr,y:top-8,class:'tick','text-anchor':'end'},graph,'size of the jump in f″ at each join');
  const st=niceStep(vmax);for(let v=0;v<=vmax+1e-9;v+=st){el('line',{x1:L,y1:gy(v),x2:Rr,y2:gy(v),class:'grid'},graph);el('text',{x:L-8,y:gy(v)+5,class:'tick','text-anchor':'end'},graph,fmt(v));}
  for(let i=1;i<n;i++)el('text',{x:cx(i),y:bot+18,class:'tick','text-anchor':'middle'},graph,'p'+(i+1));
  const bw=Math.min(22,w*0.3);
  ['cr','bs'].forEach((k,q)=>{const col=k==='cr'?'#2a5bd7':'#7a3fd1';
    for(let i=1;i<n;i++){const j=J[k][i-1],x=cx(i)+(q?bw*0.6:-bw*0.6)-bw/2,over=j>JUMP_LIMIT,h=Math.max(0,bot-gy(j));
      if(h>0.5)el('rect',{x:x,y:gy(j),width:bw,height:h,fill:col,stroke:over?'var(--bad)':'none','stroke-width':over?3:0,opacity:.9},graph);
      if(over||j>0.15)el('text',{x:x+bw/2,y:gy(j)-5,class:'tick','text-anchor':'middle',style:over?'fill:var(--bad);font-weight:700':'fill:var(--muted)'},graph,f1(j));}});
  const yl=gy(JUMP_LIMIT);el('line',{x1:L,y1:yl,x2:Rr,y2:yl,stroke:'var(--bad)','stroke-width':1.5,'stroke-dasharray':'6 4'},graph);
  el('text',{x:L+6,y:yl-5,class:'tick',style:'fill:var(--bad)'},graph,'limit '+JUMP_LIMIT);
  el('text',{x:L+6,y:top-8,class:'tick',style:'fill:#2a5bd7'},graph,'blue: Catmull–Rom');el('text',{x:L+150,y:top-8,class:'tick',style:'fill:#7a3fd1'},graph,'purple: B-spline (no jump)');
  RIDE.playhead=el('line',{x1:0,y1:top,x2:0,y2:bot,stroke:'var(--ink)','stroke-width':1.5,opacity:.5},graph);
  RIDE.gx=s=>Math.max(L,Math.min(Rr,L+(s-0.5)*w));RIDE.top=top;RIDE.bot=bot;
  RIDE.playhead.setAttribute('x1',RIDE.gx(RIDE.s));RIDE.playhead.setAttribute('x2',RIDE.gx(RIDE.s));
}
function cityRender(){
  clearBoard();view={cx:12.2,cy:8.3,w:24.5};
  const R=cityRoutes();
  drawCityMap(R);
  /* gates for the current challenge */
  const ch=CHAL[CITY.chal];
  if(ch.gates){const ev=chalEval();ch.gates.forEach((g,i)=>gate(g.c,g.r,false,g.n==='fountain'?'':g.n));}
  polyline(CITY.pts,'poly');
  drawSegs(R.cr.S,'cr');drawSegs(R.bs.S,'bs');
  ['cr','bs'].forEach(k=>{const r=R[k];let run=[];const flush=()=>{if(run.length>1)el('polyline',{points:run.join(' '),fill:'none',stroke:'#c0392b','stroke-width':9,'stroke-linecap':'round',opacity:.85});run=[];};
    r.samples.forEach((sm,i)=>{if(r.hits[i])run.push(X(sm.pt[0])+','+Y(sm.pt[1]));else flush();});flush();});
  drawKnots(R.cr.S);
  CITY.pts.forEach((p,i)=>handle('P'+i,p));
  if(CITY.sel!=null&&CITY.pts[CITY.sel])el('circle',{cx:X(CITY.pts[CITY.sel][0]),cy:Y(CITY.pts[CITY.sel][1]),r:20,fill:'none',stroke:'#d6531a','stroke-width':3,'stroke-dasharray':'5 4'});
  CITY.pts.forEach((p,i)=>label(p,'p_{'+i+'}',10,-12,'lblm'));
  if(CITY.mode==='remove')CITY.pts.forEach((p,i)=>{const x=X(p[0])+14,y=Y(p[1])+14;el('circle',{cx:x,cy:y,r:10,fill:'#c0392b',stroke:'#fff','stroke-width':2,'data-h':'P'+i});el('text',{x:x,y:y+5,'text-anchor':'middle',fill:'#fff','font-size':15,'font-weight':700,'pointer-events':'none'},board,'×');});
  drawMapCameras(Object.assign(R,{}));
  stripTwo(R);
  /* readout */
  const ev=chalEval();
  let html='';
  if(CITY.chal===0){html=`<div class="readout"><div><span style="color:#2a5bd7"><b>Catmull–Rom</b></span>: ${R.cr.S.length} segments &nbsp; <span style="color:#7a3fd1"><b>B-spline</b></span>: ${R.bs.S.length} segments</div><div class="tiny">${CITY.pts.length} points</div>${(ev.cr.hit||ev.bs.hit)?'<div class="no">'+['cr','bs'].filter(k=>ev[k].hit).map(k=>k==='cr'?'Catmull–Rom':'B-spline').join(' and ')+' goes through a building (red on the map).</div>':''}</div>`;}
  else{html=`<div class="readout">${['cr','bs'].map(k=>`<div><b style="color:${k==='cr'?'#2a5bd7':'#7a3fd1'}">${k==='cr'?'Catmull–Rom':'B-spline'}</b> <span class="${ev[k].ok?'ok':'no'}">${ev[k].ok?'✓':'✗'}</span> <span class="tiny">${ev[k].lines.join(' · ')}</span></div>`).join('')}</div>`;}
  $('readout').innerHTML=html;
}
function renderChips(){
  const box=CITY.chips;box.innerHTML='<h3 class="mh">Missions</h3>';
  CHAL.forEach((c,i)=>{const b=document.createElement('button');b.className='btn mrow'+(CITY.chal===i?' on':'');
    b.innerHTML=i?`<span class="cb">${prog['c'+i]?'☑':'☐'}</span> ${i}. ${c.name}`:'Free play <span class="tiny">(no check)</span>';
    b.onclick=()=>selectChal(i);box.appendChild(b);});
}
function dirWord(v){return Math.abs(v[0])>Math.abs(v[1])?(v[0]>0?'to the right':'to the left'):(v[1]>0?'up':'down');}
function nearestIdx(c){let b=0,bd=1e9;CITY.pts.forEach((p,i)=>{const d=len(sub(p,c));if(d<bd){bd=d;b=i;}});return b;}
function missionCheck(){
  if(!CITY.chal)return;
  const R=cityRoutes(),ev=chalEval(),nm={cr:'Catmull–Rom',bs:'B-spline'},msgs=[];
  ['cr','bs'].forEach(k=>{
    if(ev[k].hit)msgs.push(`${nm[k]} goes through a building near p<sub>${nearestIdx(ev[k].hit)}</sub>. Move that point onto the street.`);
    if(ev[k].ok)return;
    if(CITY.chal===1)CHAL[1].gates.forEach(g=>{let m=1e9,q=null;R[k].samples.forEach(s=>{const d=len(sub(s.pt,g.c));if(d<m){m=d;q=s.pt;}});
      if(m>g.r)msgs.push(`${nm[k]} misses the ${g.n} by ${f1(m-g.r)}. Move p<sub>${nearestIdx(g.c)}</sub> ${dirWord(sub(g.c,q))} by one grid step.`);});
    if(CITY.chal===2){const J=jumps(R[k].S);let mx=0,ix=0;J.forEach((v,i)=>{if(v>mx){mx=v;ix=i;}});
      msgs.push(`${nm[k]} still jumps by ${f1(mx)} at p<sub>${ix+2}</sub> (limit ${JUMP_LIMIT}). Round that corner with a point before it, one on the bend and one after it.`);}
    if(CITY.chal===3){const o=ev[k];
      if(o.df>CHAL[3].gates[1].r){let m=1e9,q=null;R[k].samples.forEach(s=>{const d=len(sub(s.pt,CHAL[3].gates[1].c));if(d<m){m=d;q=s.pt;}});
        msgs.push(k==='cr'?`${nm[k]} misses the fountain by ${f1(m-0.5)}. It passes through every point you place, so put a point on the fountain.`:`${nm[k]} misses the fountain by ${f1(m-0.5)}. It cuts inside each turn, so move the points around the fountain further out.`);}
      if(!o.sd)msgs.push(`${nm[k]} does not start at the depot heading north. Add a point before the start.`);
      if(!o.ed)msgs.push(`${nm[k]} does not end at the harbor heading east. Add a point after the end.`);}
  });
  if(!msgs.length){prog['c'+CITY.chal]=1;if(prog.c1&&prog.c2&&prog.c3)prog['d'+cur]=1;saveProg();buildSteps();renderChips();
    say('good','<b>Mission done.</b> Both routes pass.');}
  else say('bad',msgs.join('<br>'));
}
function selectChal(i){
  CITY.chal=i;CITY.pts=defaultFor(i);CITY.ten=0;RIDE.s=0;RIDE.trails={cr:[],bs:[]};
  if(CITY.tenSlider){CITY.tenSlider.value=0;CITY.tenOut.textContent='0';}
  $('story').innerHTML=`<p class="goal">${CHAL[i].text}</p>`;
  hintsShown=0;hintsHidden=false;levels[cur].hints=CHAL_HINTS[i];$('hints').innerHTML='';$('bHint').style.display=CHAL_HINTS[i].length?'':'none';
  say('','');CITY.sel=null;CITY.mode='move';if(CITY.rmBtn)CITY.rmBtn.textContent='Remove a point';$('bCheck').style.display=i?'':'none';renderChips();cityRender();
}
levels.push({
  short:'City ride',title:'City ride',group:'Playground',noCheck:false,graph:true,snapTo:0.5,
  hints:[],story:'',
  formulas(){return `<div class="w">The ball is pushed by the camera's acceleration, f″.<div class="formula">Catmull–Rom: d<sub>k</sub> = ½ (1 − t) (p<sub>k+1</sub> − p<sub>k−1</sub>), C¹ only: f″ jumps at the joins<br>B-spline: (P<sub>j</sub> + 4·P<sub>j+1</sub> + P<sub>j+2</sub>) / 6 at each join, C²: f″ has no jump</div>Both routes use the same points. With n points, each route has n − 3 segments.</div>`;},
  setup(){
    if(!CITYDATA)CITYDATA=buildCityData();
    CITY.levelIndex=cur;CITY.chal=0;CITY.pts=DEFAULT_PTS();CITY.ten=0;CITY.mode='move';
    const ride=$('ride');ride.style.display='';ride.innerHTML='';
    const rs=document.createElement('div');rs.className='rides';
    rs.innerHTML='<figure><canvas id="cvA" width="360" height="230"></canvas><figcaption style="color:#2a5bd7">Catmull–Rom</figcaption></figure><figure><canvas id="cvB" width="360" height="230"></canvas><figcaption style="color:#7a3fd1">B-spline</figcaption></figure>';
    ride.appendChild(rs);
    const tr=document.createElement('div');tr.className='transport';ride.appendChild(tr);
    RIDE.cvA=$('cvA');RIDE.cvB=$('cvB');
    RIDE.playBtn=btn(tr,'❚❚ Pause','',()=>{RIDE.playing=!RIDE.playing;RIDE.playBtn.textContent=RIDE.playing?'❚❚ Pause':'▶ Play';});
    RIDE.playing=true;
    const sl=document.createElement('input');sl.type='range';sl.min=0;sl.max=6;sl.step=0.01;sl.value=0;sl.setAttribute('aria-label','ride position');
    sl.addEventListener('input',()=>{RIDE.s=parseFloat(sl.value);RIDE.playing=false;RIDE.playBtn.textContent='▶ Play';});tr.appendChild(sl);RIDE.slider=sl;
    const sel=document.createElement('select');[[0.25,'0.25×'],[0.5,'0.5×'],[1,'1×'],[2,'2×']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];if(o[0]===1)op.selected=true;sel.appendChild(op);});
    sel.onchange=()=>{RIDE.rate=parseFloat(sel.value);};tr.appendChild(sel);RIDE.rate=1;
    /* missions list */
    const chips=document.createElement('div');chips.className='mlist';$('inputs').appendChild(chips);CITY.chips=chips;
    /* edit buttons */
    const h2=document.createElement('h3');h2.className='mh';h2.textContent='Edit the route';$('inputs').appendChild(h2);
    const r1=newRow();
    btn(r1,'Add a point','',()=>{
      const p=CITY.pts;let bi=0,bl=-1;for(let i=0;i<p.length-1;i++){const l=len(sub(p[i+1],p[i]));if(l>bl){bl=l;bi=i;}}
      const m=mul(add(p[bi],p[bi+1]),0.5);CITY.pts.splice(bi+1,0,[snapv(m[0],0.5),snapv(m[1],0.5)]);CITY.sel=bi+1;CITY.mode='move';CITY.rmBtn.textContent='Remove a point';
      say('info',`New point p<sub>${bi+1}</sub> added in the middle of the longest gap (dashed ring). Drag it where you want it.`);cityRender();});
    CITY.rmBtn=btn(r1,'Remove a point','',()=>{
      if(CITY.mode==='remove'){CITY.mode='move';CITY.rmBtn.textContent='Remove a point';say('','');}
      else{CITY.mode='remove';CITY.rmBtn.textContent='Cancel remove';say('info','Click the red × beside the point you want to remove.');}
      CITY.sel=null;cityRender();});
    const r2=newRow();
    btn(r2,'+ point before the start','',()=>{const p=CITY.pts;CITY.pts.unshift(extPt(p[0],p[1]));CITY.sel=0;say('info','New point p<sub>0</sub> added before the start.');cityRender();});
    btn(r2,'+ point after the end','',()=>{const p=CITY.pts,n=p.length;CITY.pts.push(extPt(p[n-1],p[n-2]));CITY.sel=n;say('info',`New point p<sub>${n}</sub> added after the end.`);cityRender();});
    btn(r2,'Reset points','',()=>{CITY.pts=defaultFor(CITY.chal);CITY.ten=0;CITY.sel=null;CITY.mode='move';CITY.rmBtn.textContent='Remove a point';say('','');if(CITY.tenSlider){CITY.tenSlider.value=0;CITY.tenOut.textContent='0';}cityRender();});
    const tin=sliderRow($('inputs'),'tension <b>t</b> (Catmull–Rom)',0,1,0.05,0,v=>{CITY.ten=v;cityRender();});
    CITY.tenSlider=tin;CITY.tenOut=tin.parentNode.querySelector('b');
    board.style.cursor='';
    CITY.chal=0;selectChal(0);
    RIDE.last=0;RIDE.raf=requestAnimationFrame(rideFrame);
  },
  check(){missionCheck();},
  onDrag(id,p){if(CITY.mode!=='move')return;const i=+id.slice(1);CITY.sel=null;say('','');CITY.pts[i]=[Math.max(0,Math.min(24,p[0])),Math.max(-0.5,Math.min(17.5,p[1]))];},
  onHandleTap(id){if(CITY.mode==='remove'){if(CITY.pts.length>5){const i=+id.slice(1);CITY.pts.splice(i,1);CITY.mode='move';CITY.rmBtn.textContent='Remove a point';say('info',`Point p<sub>${i}</sub> removed. The points after it are renumbered.`);}else say('bad','A route needs at least 5 points.');return true;}return false;},
  render(){const n=cityRoutes().cr.S.length;if(RIDE.slider){RIDE.slider.max=Math.max(1,n);}cityRender();}
});

/* ------------------------------------------------------------------ boot */
buildSteps();go(0);
window.__t={levels,go:i=>go(i),A1,A2,A3,CITY,RIDE,cityRoutes,chalEval,selectChal,a3eval:typeof a3eval!=='undefined'?a3eval:null,get cur(){return cur;},get prog(){return prog;}};
